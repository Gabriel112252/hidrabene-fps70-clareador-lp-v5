name: Patch Insight Protetor

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Executa patch direto do Insight no Protetor'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Atualizar index e limpar Dockerfile
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          s = index.read_text()

          replacements = {
              'https://hidrabene.pay.yampi.com.br/r/FQH20J70UC': 'https://insight.hidrabene.com.br/click/1',
              'https://hidrabene.pay.yampi.com.br/r/524DBLU40W': 'https://insight.hidrabene.com.br/click/2',
              'https://hidrabene.pay.yampi.com.br/r/KIAU1RFFXS': 'https://insight.hidrabene.com.br/click/3',
          }
          for old, new in replacements.items():
              s = s.replace(old, new)

          uniclick = '  <script src="https://insight.hidrabene.com.br/uniclick.js?attribution=lastpaid&cookiedomain=hidrabene.com.br&cookieduration=90&defaultcampaignid=6aa2f755818faec5cb6874a2&regviewonce=false&rtkcidurl=true&script_id=6aa2f88e1044a350a10f243d"></script>\n'
          if 'script_id=6aa2f88e1044a350a10f243d' not in s:
              s = s.replace('</head>', uniclick + '</head>', 1)

          index.write_text(s)

          Path('Dockerfile').write_text('FROM nginx:alpine\n\nCOPY . /usr/share/nginx/html\n\nEXPOSE 80\n\nCMD ["nginx", "-g", "daemon off;"]')
          PY

          rm -f .github/workflows/patch-insight-protetor.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html Dockerfile .github/workflows/patch-insight-protetor.yml
          git commit -m "Move Insight do Protetor para o index.html"
          git push origin HEAD:main
